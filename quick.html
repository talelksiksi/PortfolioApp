<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Talel Ksiksi · CICTNA RDC — Quick view</title>
  <meta name="description" content="Talel Ksiksi / CICTNA RDC: industrial automation, OPC UA and PLC integration, real-time dashboards and web apps. One-page overview.">
  <meta name="theme-color" content="#3d6d78">
  <meta property="og:title" content="Talel Ksiksi · CICTNA RDC">
  <meta property="og:description" content="Industrial software, integrations and web apps. One-page overview.">
  <meta property="og:image" content="https://cictnardc.net/portfolio/assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <style>
    :root {
      --teal: #3d6d78; --teal-dark: #24464e; --teal-deep: #183238; --sun: #e7a982; --sun-light: #f1c09b;
      --mist: #d6e2e5; --paper: #f6f4f0; --ink: #16242a; --muted: #50636a; --line: #d9dfe1; --card: #ffffff;
      --font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --paper: #11201f; --ink: #e8eef0; --muted: #a8b9be; --line: #2a3d42; --card: #172a2e; }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font: 16px/1.6 var(--font); color: var(--ink); background: var(--paper); }
    a { color: inherit; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
    header.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
    header.top .wrap { display: flex; align-items: center; gap: 14px; height: 60px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .06em; text-decoration: none; }
    .brand span b { color: var(--sun); font-weight: 800; }
    nav.links { margin-left: auto; display: flex; gap: 18px; font-size: 14px; }
    nav.links a { text-decoration: none; color: var(--muted); }
    nav.links a:hover { color: var(--ink); }
    .langs button { font: 700 12px var(--font); border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 4px 8px; cursor: pointer; border-radius: 4px; }
    .langs button[aria-pressed="true"] { background: var(--teal-dark); color: #fff; border-color: var(--teal-dark); }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 6px; font-weight: 700; text-decoration: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 15px; cursor: pointer; }
    .btn.primary { background: var(--sun); border-color: var(--sun); color: #1b1b1b; }
    .btn.dark { background: var(--teal-dark); border-color: var(--teal-dark); color: #fff; }
    .btn:hover { filter: brightness(1.05); }
    .hero { background: radial-gradient(ellipse 70% 60% at 75% 110%, rgba(231,169,130,.55), transparent 70%), linear-gradient(160deg, var(--teal-deep), var(--teal)); color: #fff; padding: 72px 0 64px; position: relative; overflow: hidden; }
    .hero::after { content: ""; position: absolute; right: -60px; bottom: -120px; width: 420px; height: 420px; background: url(assets/logo.svg) center/contain no-repeat; opacity: .14; }
    .hero .kicker { color: var(--sun-light); }
    .hero h1 { font-size: clamp(34px, 6vw, 58px); line-height: 1.08; margin: 10px 0 16px; max-width: 16ch; }
    .hero p { font-size: 19px; color: var(--mist); max-width: 52ch; margin: 0 0 26px; }
    .hero .ctas { display: flex; flex-wrap: wrap; gap: 10px; position: relative; z-index: 1; }
    .hero .btn:not(.primary) { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.3); }
    .kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; color: var(--teal); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kicker { color: var(--sun-light); } }
    section { padding: 64px 0; border-bottom: 1px solid var(--line); }
    section h2 { font-size: clamp(26px, 4vw, 36px); margin: 6px 0 24px; line-height: 1.15; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: -36px; position: relative; z-index: 2; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    .stat b { display: block; font-size: 36px; color: var(--teal); line-height: 1; margin-bottom: 6px; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stat b { color: var(--sun); } }
    .stat span { color: var(--muted); font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; }
    .card h3 { margin: 4px 0 8px; font-size: 19px; }
    .card p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
    .card ul { margin: 0 0 14px; padding-left: 18px; font-size: 14px; color: var(--muted); }
    .card .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: auto 0 14px; }
    .card .tags span { font: 12px var(--mono); background: color-mix(in srgb, var(--teal) 12%, transparent); padding: 2px 8px; border-radius: 4px; }
    .card .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .card .row .btn { padding: 8px 12px; font-size: 14px; }
    .card img { width: calc(100% + 40px); margin: -20px -20px 16px; border-radius: 10px 10px 0 0; display: block; height: auto; border-bottom: 1px solid var(--line); }
    .work { border-left: 3px solid var(--sun); padding: 4px 0 4px 16px; }
    .work h3 { margin: 4px 0 6px; font-size: 17px; }
    .work p { margin: 0; color: var(--muted); font-size: 15px; }
    .contact { background: linear-gradient(160deg, var(--teal-deep), var(--teal)); color: #fff; border: 0; }
    .contact h2 { color: #fff; }
    .contact p { color: var(--mist); max-width: 56ch; }
    .contact .kicker { color: var(--sun-light); }
    footer { padding: 28px 0 40px; color: var(--muted); font-size: 14px; }
    footer .wrap { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; }
    @media (max-width: 720px) { nav.links { display: none; } .langs { margin-left: auto; } .hero { padding: 48px 0 60px; } section { padding: 48px 0; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="#top"><img src="assets/logo.svg" alt="" width="32" height="32"><span>CICTNA <b>RDC</b></span></a>
      <nav class="links" id="nav"></nav>
      <div class="langs" role="group" aria-label="Language"><button type="button" data-l="en">EN</button> <button type="button" data-l="fr">FR</button></div>
    </div>
  </header>
  <main id="top"></main>
  <footer><div class="wrap" id="foot"></div></footer>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script>
  (function () {
    const Q = {
      en: {
        nav: ["Services", "Projects", "Track record", "Contact"],
        hero: "Software for operations that can't stop.",
        lead: "Controllers, PLC and OPC UA integrations, real-time dashboards and client portals. Built by an engineer whose systems run in production on three continents.",
        talk: "Start a project", call: "Book a call", cv: "CV", desktop: "Open the interactive desktop",
        svcK: "Services", svcH: "What we build",
        prjK: "Projects", prjH: "Recent work you can click",
        live: "Live demo", details: "Details",
        trkK: "Track record", trkH: "Systems running in production", trkNote: "Client names are left out on purpose; references available on request.",
        ctK: "Contact", ctH: "Tell us what's slowing your operation down.",
        ctP: "We reply within one business day. A 30-minute discovery call is free.",
        mail: "Email us", foot: "Prefer something more playful? ",
      },
      fr: {
        nav: ["Services", "Projets", "Références", "Contact"],
        hero: "Du logiciel pour les opérations qui ne s'arrêtent jamais.",
        lead: "Contrôleurs, intégrations automates et OPC UA, tableaux de bord temps réel et portails clients. Conçus par un ingénieur dont les systèmes tournent en production sur trois continents.",
        talk: "Démarrer un projet", call: "Prendre rendez-vous", cv: "CV", desktop: "Ouvrir le bureau interactif",
        svcK: "Services", svcH: "Ce que nous construisons",
        prjK: "Projets", prjH: "Des réalisations récentes à essayer",
        live: "Démo en ligne", details: "Détails",
        trkK: "Références", trkH: "Des systèmes en production", trkNote: "Les noms des clients sont volontairement omis ; références disponibles sur demande.",
        ctK: "Contact", ctH: "Dites-nous ce qui freine votre activité.",
        ctP: "Nous répondons sous un jour ouvré. Un appel découverte de 30 minutes est offert.",
        mail: "Nous écrire", foot: "Envie de quelque chose de plus ludique ? ",
      },
    };
    const qs = new URLSearchParams(location.search).get("lang");
    if (qs === "en" || qs === "fr") Lang.set(qs);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function render() {
      const l = Lang.get(), q = Q[l], suffix = l === "fr" ? "?lang=fr" : "";
      document.title = "Talel Ksiksi · CICTNA RDC — " + (l === "fr" ? "Vue rapide" : "Quick view");
      document.querySelectorAll(".langs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === l));
      const ids = ["services", "projects", "track", "contact"];
      document.getElementById("nav").innerHTML = q.nav.map((n, i) => `<a href="#${ids[i]}">${esc(n)}</a>`).join("");
      const cvBtns = ["en", "fr"].filter((k) => SITE.cv[k]).map((k) =>
        `<a class="btn" href="${SITE.cv[k]}" target="_blank" rel="noopener">${q.cv} ${k.toUpperCase()}</a>`).join("");

      document.getElementById("top").innerHTML = `
        <div class="hero"><div class="wrap">
          <div class="kicker">${esc(SITE.owner)} · ${esc(SITE.studio)}</div>
          <h1>${esc(q.hero)}</h1>
          <p>${esc(q.lead)}</p>
          <div class="ctas">
            <a class="btn primary" href="index.html${suffix}#contact">${esc(q.talk)}</a>
            <a class="btn" href="index.html${suffix}#book">${esc(q.call)}</a>
            ${cvBtns}
            <a class="btn" href="index.html${suffix}">${esc(q.desktop)} →</a>
          </div>
        </div></div>
        <div class="wrap"><div class="stats">${TRACK.stats.map((s) => `<div class="stat"><b>${esc(s.n)}</b><span>${esc(L(s))}</span></div>`).join("")}</div></div>

        <section id="services"><div class="wrap">
          <div class="kicker">${esc(q.svcK)}</div><h2>${esc(q.svcH)}</h2>
          <div class="grid">${SERVICES.map((s) => `<div class="card"><h3>${esc(L(s.title))}</h3><p>${esc(L(s.text))}</p></div>`).join("")}</div>
        </div></section>

        <section id="projects"><div class="wrap">
          <div class="kicker">${esc(q.prjK)}</div><h2>${esc(q.prjH)}</h2>
          <div class="grid">${PROJECTS.map((p) => `
            <article class="card">
              ${p.shot ? `<img src="${p.shot}" alt="${esc(p.name)}" loading="lazy" width="1280" height="800">` : ""}
              <div class="kicker">${esc(L(p.category))}</div>
              <h3>${esc(p.name)}</h3>
              <p>${esc(L(p.summary))}</p>
              <ul>${L(p.highlights).slice(0, 3).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
              <div class="tags">${p.stack.map((s) => `<span>${esc(L(s))}</span>`).join("")}</div>
              <div class="row">
                ${p.live ? `<a class="btn primary" href="${p.live}" target="_blank" rel="noopener">${esc(q.live)} ↗</a>` : ""}
                <a class="btn" href="index.html${suffix}#project/${p.id}">${esc(q.details)}</a>
              </div>
            </article>`).join("")}</div>
        </div></section>

        <section id="track"><div class="wrap">
          <div class="kicker">${esc(q.trkK)}</div><h2>${esc(q.trkH)}</h2>
          <p style="color:var(--muted);margin-top:-10px">${esc(q.trkNote)}</p>
          <div class="grid">${TRACK.work.map((w) => `<div class="work"><div class="kicker">${esc(L(w.sector))}</div><h3>${esc(L(w.title))}</h3><p>${esc(L(w.text))}</p></div>`).join("")}</div>
        </div></section>

        <section id="contact" class="contact"><div class="wrap">
          <div class="kicker">${esc(q.ctK)}</div><h2>${esc(q.ctH)}</h2>
          <p>${esc(q.ctP)}</p>
          <div class="ctas" style="display:flex;flex-wrap:wrap;gap:10px">
            <a class="btn primary" href="index.html${suffix}#contact">${esc(q.talk)}</a>
            <a class="btn" href="index.html${suffix}#book">${esc(q.call)}</a>
            <a class="btn" href="mailto:${SITE.email}">${esc(q.mail)}: ${esc(SITE.email)}</a>
          </div>
        </div></section>`;
      document.getElementById("foot").innerHTML =
        `<span>© ${new Date().getFullYear()} ${esc(SITE.studio)} · ${esc(SITE.owner)}</span>
         <span><a href="${SITE.website}">cictnardc.net</a> · ${esc(q.foot)}<a href="index.html${suffix}">${esc(q.desktop)}</a></span>`;
    }
    document.querySelectorAll(".langs button").forEach((b) => b.addEventListener("click", () => Lang.set(b.dataset.l)));
    window.addEventListener("lang:change", render);
    render();
  })();
  </script>
  <script>if (/\.vercel\.app$/.test(location.hostname)) { var va = document.createElement("script"); va.defer = true; va.src = "/_vercel/insights/script.js"; document.head.appendChild(va); }</script>
</body>
</html>
