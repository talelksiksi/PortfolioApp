<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Talel Ksiksi · CICTNA RDC</title>
  <meta name="description" content="Portfolio of Talel Ksiksi (CICTNA RDC): industrial automation, OPC UA and PLC integration, real-time dashboards and web apps. Explore it as a retro desktop.">
  <meta name="theme-color" content="#3d6d78">
  <meta property="og:title" content="Talel Ksiksi · CICTNA RDC">
  <meta property="og:description" content="Industrial software, integrations and web apps. Boot the desktop and open the project folders. Also in French.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cictnardc.net/portfolio/">
  <meta property="og:image" content="https://cictnardc.net/portfolio/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="alternate" href="quick.html" title="One-page quick view">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Boot sequence -->
  <div id="boot" aria-hidden="true">
    <pre id="boot-log"></pre>
    <div id="splash" hidden>
      <img src="assets/logo.svg" alt="" width="104" height="104">
      <div class="splash-brand">CICTNA<span>RDC</span></div>
      <h1 id="splash-hello"></h1>
      <p id="splash-sub"></p>
      <div class="splash-bar"><i></i></div>
      <p id="splash-line"></p>
    </div>
    <button id="boot-skip" type="button">Press any key to skip</button>
  </div>

  <main id="desktop" aria-label="Desktop">
    <ul id="icons" role="list"></ul>
    <section id="launcher" aria-label="Apps"></section>
    <div id="windows"></div>
  </main>

  <nav id="taskbar" aria-label="Taskbar">
    <button id="start-btn" type="button" aria-haspopup="menu" aria-expanded="false">
      <img src="assets/logo.svg" alt="" width="18" height="18"><span>Start</span>
    </button>
    <div id="tasks" role="list"></div>
    <div id="tray">
      <button id="tray-lang" type="button"></button>
      <button id="tray-sound" type="button"></button>
      <button id="tray-mail" type="button"></button>
      <span id="clock" aria-live="off"></span>
    </div>
  </nav>

  <div id="start-menu" role="menu" hidden>
    <div class="start-side"><span>CICTNA<b>OS</b></span></div>
    <ul id="start-list"></ul>
  </div>

  <noscript>
    <div class="noscript">
      <h1>Talel Ksiksi · CICTNA RDC</h1>
      <p>Industrial software, integrations and web apps. This portfolio is an interactive desktop and needs JavaScript.</p>
      <p>Live demos: <a href="https://integration-toolkit-dner.vercel.app">Integration Toolkit</a>, <a href="https://tray-store-controller.vercel.app">Tray Store Controller</a>, <a href="https://plant-data-logger.vercel.app">Plant Data Logger</a>, <a href="https://warehouse-dashboard-umber.vercel.app">Warehouse Dashboard</a>, <a href="https://warehouse-portal-demo.vercel.app">Warehouse Management Portal</a>, <a href="https://dental-clinic-demo-six-rouge.vercel.app">Dental Clinic Manager</a>.</p>
      <p>Contact: <a href="mailto:contact@cictnardc.net">contact@cictnardc.net</a> · <a href="quick.html">One-page version</a></p>
    </div>
  </noscript>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/wallpaper.js"></script>
  <script src="js/wm.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/main.js"></script>
  <!-- Vercel Web Analytics on the vercel.app copy only; cictnardc.net uses Cloudflare Web Analytics. -->
  <script>if (/\.vercel\.app$/.test(location.hostname)) { var va = document.createElement("script"); va.defer = true; va.src = "/_vercel/insights/script.js"; document.head.appendChild(va); }</script>
</body>
</html>
